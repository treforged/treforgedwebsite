name: Publish daily blog article

# Publishes the next queued article once per day and pushes the
# regenerated blog index, homepage teaser, and sitemap back to the repo.
# Runs on GitHub-hosted runners by default, or on Tre's PC when the repo
# variable ARTICLE_RUNNER=pc (see the runs-on comment and docs/cloudflare-cutover.md).
# Once the site is on Cloudflare Pages, the push this job makes IS the deploy:
# Cloudflare builds every push to main.

on:
  schedule:
    # 13:00 UTC daily (~9:00 AM Eastern). Adjust as you like.
    - cron: '0 13 * * *'
  workflow_dispatch: {}  # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  publish:
    # Which machine publishes. Unset (today): GitHub-hosted, which needs Actions
    # minutes. ARTICLE_RUNNER=pc (repo Settings > Secrets and variables >
    # Actions > Variables): Tre's Windows self-hosted runner, which uses no
    # minutes - set it only AFTER the repo is private (the first step refuses
    # otherwise). If the PC is off, the job waits in the queue for the runner
    # (GitHub drops a queued job after 24 hours) and runs when the PC comes on.
    # See docs/cloudflare-cutover.md.
    runs-on: ${{ vars.ARTICLE_RUNNER == 'pc' && fromJSON('["self-hosted","windows"]') || 'ubuntu-latest' }}
    # bash on both: the steps are bash, and the Windows runner gets it from Git
    # for Windows. Without this they would run under PowerShell and fail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Only ever on Tre's PC when the repo is PRIVATE. A self-hosted runner on a
      # public repo can be handed code by strangers; Sam's runner is registered
      # for private repos only. This refuses before any script runs if the variable
      # was flipped while the repo is still public. Skipped on GitHub-hosted runners.
      - name: Refuse the PC runner on a public repo
        if: runner.environment == 'self-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY, {headers: {authorization: 'Bearer ' + process.env.GH_TOKEN, 'user-agent': 'treforged-bot'}}).then(r => r.json()).then(j => { if (j.private !== true) { console.error('REFUSED: ' + process.env.GITHUB_REPOSITORY + ' is not private (private=' + j.private + '). Unset the ARTICLE_RUNNER variable or make the repo private first.'); process.exit(1); } console.log('repo is private - PC runner allowed'); }).catch(e => { console.error('could not confirm the repo is private: ' + e.message); process.exit(1); })"

      - name: Generate a fresh article with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-article.mjs

      - name: Publish next queued article
        run: node scripts/publish-next.mjs

      # publish-next renders the NEW post only and never touches existing ones,
      # so without this every post ships linked by nobody and receives none of
      # the site's internal authority. That is what left 57 of 63 posts orphaned
      # before 2026-09-02. Idempotent: a no-op day changes nothing.
      - name: Relink related posts (no post left orphaned)
        if: always()
        run: node scripts/backfill-related.mjs --apply

      # main.js and styles.css have no hash in their filenames, so a Cloudflare
      # cache rule served a stale main.js to real visitors on 2026-09-05 while
      # the origin already had the fix. The HTML is not edge-cached, so stamping
      # the current content hash onto those two references is what makes a
      # deploy actually reach people. No-op on a day when neither file changed.
      - name: Stamp asset versions (so a cached edge cannot serve stale JS)
        if: always()
        run: node scripts/version-assets.mjs

      # A post Google cannot index, or one linking to a post that does not
      # exist, is worse than no post: it ships to production on commit and
      # there is no staging. Gate runs even when publishing failed, so
      # catch-up posts are checked too.
      - name: SEO gate
        id: seo
        if: always()
        run: |
          node scripts/generator-prompt.test.mjs
          node scripts/test-cta-clicks.mjs
          node scripts/body-sync.mjs
          node scripts/test-version-assets.mjs
          node scripts/version-assets.mjs --check
          node scripts/test-source-attribution.mjs
          node scripts/seo-check.mjs
          node scripts/form-control-theming.mjs
          # Tool suites are DISCOVERED, not listed, so a new calculator is gated
          # the day it lands - and a discovery of zero fails rather than passing
          # quietly, which is the exact trap this gate itself fell into.
          ran=0
          for t in tools/*/calc.test.mjs tools/*/costs.test.mjs tools/*/page.test.mjs; do
            [ -f "$t" ] || continue
            echo "--- $t"
            node "$t"
            ran=$((ran + 1))
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::no tool test suites found under tools/*/ - the gate would have passed on nothing"
            exit 1
          fi
          echo "tool suites run: $ran"

      - name: Commit & push if changed
        # always(): a loud publish failure (empty/exhausted queue) still exits 1
        # so the run goes red, but any catch-up posts already written must be
        # committed rather than lost. Nothing commits if the SEO gate failed.
        if: always() && steps.seo.outcome == 'success'
        run: |
          git config user.name "treforged-bot"
          git config user.email "bot@treforged.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "[blog]: auto-publish next queued article ($(date -u +%Y-%m-%d))"
            # Retry on a non-fast-forward rather than losing the article.
            # The runner checks out a sha and then spends minutes generating, so
            # ANY push to main in that window makes this push a non-fast-forward
            # and the day's post is discarded - it is committed here inside the
            # runner and then thrown away with the workspace. That happened on
            # 2026-09-17: the article was written, the SEO gate passed, and the
            # push was rejected because a desk had pushed a docs commit while it
            # ran. Rebase and retry; the post is a new file, so it does not
            # conflict with anything a human is editing.
            for attempt in 1 2 3; do
              if git push; then
                echo "pushed on attempt $attempt"
                exit 0
              fi
              echo "push rejected (attempt $attempt) - rebasing onto origin/main"
              git pull --rebase origin main
            done
            echo "::error::could not push the published article after 3 attempts"
            exit 1
          else
            echo "No changes to publish (queue may be empty)."
          fi
