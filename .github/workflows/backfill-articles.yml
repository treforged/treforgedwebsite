name: Backfill pruned blog articles

# One-off maintenance: regenerates articles that were pruned for truncation
# and republishes them on their original dates. Trigger manually from the
# Actions tab (or `gh workflow run`) with the slug=date list.

on:
  workflow_dispatch:
    inputs:
      articles:
        description: 'Space-separated slug=YYYY-MM-DD pairs'
        required: true
        default: 'zero-based-budgeting-guide=2026-07-07 how-to-replace-windshield-wiper-blades=2026-07-08 needs-vs-wants=2026-07-12 how-to-check-tire-pressure-and-tread=2026-07-14 sinking-funds-explained=2026-07-15 how-to-cut-monthly-expenses=2026-07-16'

permissions:
  contents: write

concurrency:
  group: daily-article
  cancel-in-progress: false

jobs:
  backfill:
    # Which machine publishes. Unset (today): GitHub-hosted, which needs Actions
    # minutes. ARTICLE_RUNNER=pc (repo Settings > Secrets and variables >
    # Actions > Variables): Tre's Windows self-hosted runner, which uses no
    # minutes - set it only AFTER the repo is private (the first step refuses
    # otherwise). If the PC is off, the job waits in the queue for the runner
    # (GitHub drops a queued job after 24 hours) and runs when the PC comes on.
    # See docs/cloudflare-cutover.md.
    runs-on: ${{ vars.ARTICLE_RUNNER == 'pc' && fromJSON('["self-hosted","windows"]') || 'ubuntu-latest' }}
    # bash on both: the steps are bash, and the Windows runner gets it from Git
    # for Windows. Without this they would run under PowerShell and fail.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Only ever on Tre's PC when the repo is PRIVATE. A self-hosted runner on a
      # public repo can be handed code by strangers; Sam's runner is registered
      # for private repos only. This refuses before any script runs if the variable
      # was flipped while the repo is still public. Skipped on GitHub-hosted runners.
      - name: Refuse the PC runner on a public repo
        if: runner.environment == 'self-hosted'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "fetch('https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY, {headers: {authorization: 'Bearer ' + process.env.GH_TOKEN, 'user-agent': 'treforged-bot'}}).then(r => r.json()).then(j => { if (j.private !== true) { console.error('REFUSED: ' + process.env.GITHUB_REPOSITORY + ' is not private (private=' + j.private + '). Unset the ARTICLE_RUNNER variable or make the repo private first.'); process.exit(1); } console.log('repo is private - PC runner allowed'); }).catch(e => { console.error('could not confirm the repo is private: ' + e.message); process.exit(1); })"

      - name: Regenerate and republish articles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The input reaches the shell as DATA via env, never spliced into the
          # script text, so a crafted value cannot run a command. Each pair is
          # then checked against the slug=date shape before node sees it.
          ARTICLES: ${{ inputs.articles }}
        run: |
          read -ra pairs <<< "$ARTICLES"
          for p in "${pairs[@]}"; do
            if ! [[ "$p" =~ ^[a-z0-9-]+(=[0-9]{4}-[0-9]{2}-[0-9]{2})?$ ]]; then
              echo "Refusing malformed pair: $p" >&2
              exit 1
            fi
          done
          node scripts/backfill-articles.mjs "${pairs[@]}"

      - name: Commit & push if changed
        if: always()
        run: |
          git config user.name "treforged-bot"
          git config user.email "bot@treforged.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "[blog]: backfill regenerated articles onto original dates"
            git push
          else
            echo "No changes."
          fi
