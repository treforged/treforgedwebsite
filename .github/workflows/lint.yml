name: Lint

# DELIBERATELY SEPARATE FROM daily-article.yml.
#
# The daily publish workflow installs nothing — it runs plain `node scripts/*`.
# Adding an `npm ci` to it would put a new failure surface on the path that
# ships the day's post, so a flaky registry could cost a publication. This runs
# on its own, on pushes and pull requests, and cannot block a post.
#
# It is also NON-BLOCKING ON WARNINGS by construction: every rule in
# eslint.config.mjs is `warn`, and scripts/lint-baseline.mjs exits non-zero only
# for lint ERRORS (a parse or config fault), for tracked files that fall outside
# the linter with no recorded reason, or when it examined nothing at all.
# A gate that is red on ordinary work is a gate people route around.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      # The ratchet is 1, not 0, and the 1 is named rather than rounded away:
      # main.js has an unused `e` parameter on a click handler. Renaming it is a
      # one-character change to a file whose content hash is stamped into every
      # HTML page, so fixing it alone would churn 82 files for nothing a visitor
      # can see. It goes with the next real main.js change; until then the
      # ratchet holds the line so NEW code cannot add a warning.
      - run: node scripts/lint-baseline.mjs --max-warnings=1

  # Separate job, and deliberately WITHOUT `npm ci`: this gate is plain node
  # with no dependencies, so it must not inherit the registry as a failure
  # surface. It runs on every push and PR.
  #
  # Unlike the lint job above, this one IS blocking. A browser-default form
  # control is a visible defect on a live page — Tre found a white <select> on
  # the DIY calculator himself on 2026-09-12, after it had been shipped and
  # unnoticed. It is the third visual defect this month that no test could see.
  form-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/form-control-theming.mjs
      # Printed on every run so a PASS is never read as a broader guarantee
      # than it is.
      - run: node scripts/form-control-theming.mjs --limits

  # Also dependency-free, and also blocking. A blog slug that a forge-reach
  # campaign points at cannot be renamed or deleted without this going red.
  #
  # forge-reach is a different, private repo, so it is NOT checked out here:
  # this job runs in SNAPSHOT ONLY mode and says so on every run. That still
  # catches the failure that actually happens - a slug removed from THIS repo -
  # and it deliberately cannot notice a change to the campaign list itself.
  # The desk catches that half locally, where forge-reach is a sibling folder
  # and the gate runs in DERIVED mode.
  reach-destinations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/reach-destinations.mjs
      # Printed every run so a PASS is never read as a broader guarantee.
      - run: node scripts/reach-destinations.mjs --limits
